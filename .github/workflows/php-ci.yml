name: PHP Laravel Pipeline

on:
  schedule:
    # Wakes up at 16 minutes past 4 AM, 10 AM, 4 PM, and 10 PM UTC
    # (12:16 PM, 6:16 PM, 12:16 AM, and 6:16 AM Singapore Time)
    - cron: '16 4,10,16,22 * * *'
  workflow_dispatch:

jobs:
  php-sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Fetch PHP Source
        uses: actions/checkout@v4

      - name: Mutate Model Attributes
        run: |
          # 30% chance to skip (maintains natural execution gaps)
          if [ $((RANDOM % 100)) -lt 30 ]; then
            echo "Laravel models current. Skipping execution."
            exit 0
          fi

          mkdir -p app/Models
          TARGET_FILE="app/Models/TelemetryNode.php"

          if [ ! -f "$TARGET_FILE" ]; then
            echo "<?php" > "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "namespace App\Models;" >> "$TARGET_FILE"
            echo "" >> "$TARGET_FILE"
            echo "class TelemetryNode" >> "$TARGET_FILE"
            echo "{" >> "$TARGET_FILE"
            echo "}" >> "$TARGET_FILE"
          fi

          COMPONENTS=("UserAudit" "PaymentGateway" "MetricLog" "SessionVector" "CacheProfile")
          PICKED_COMP=${COMPONENTS[$RANDOM % ${#COMPONENTS[@]}]}

          # Insert new property before final closing brace
          sed -i "$ i\\    public string \$node_${PICKED_COMP}_$RANDOM = '$RANDOM';\\n" "$TARGET_FILE"

          git config --global user.name "benji280180"
          git config --global user.email "benji280180@gmail.com"

          MESSAGES=(
            "feat: add typed property mapping to Eloquent model"
            "refactor: optimize PHP class attribute definitions"
            "fix: adjust visibility scope on model properties"
            "chore: sync laravel backend schema bounds"
          )
          MSG=${MESSAGES[$RANDOM % ${#MESSAGES[@]}]}

          git add app/
          git commit -m "$MSG"
          git push
